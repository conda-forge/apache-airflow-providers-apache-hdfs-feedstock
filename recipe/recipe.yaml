context:
  name: apache-airflow-providers-apache-hdfs
  version: 4.14.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_airflow_providers_apache_hdfs-${{ version }}.tar.gz
  sha256: f033ef47500ebee27588dcc248b5198c508b12cd7323dce9f1f178916b5c1451

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==4.0.2
  run:
    - python >=${{ python_min }}
    - apache-airflow >=2.11.0
    - apache-airflow-providers-common-compat >=1.12.0
    # tightest of upstream's floors (python >=3.12)
    - python-hdfs >=2.7.3
    # start hdfs[avro,dataframe,kerberos]
    - requests-kerberos >=0.7.0
    # end hdfs[avro,dataframe,kerberos]
    # tightest of upstream's floors (python >=3.14)
    - fastavro >=1.12.1
    # tightest of upstream's floors (python >=3.14)
    - pandas >=2.3.3
tests:
  - python:
      imports:
        - airflow.providers.apache.hdfs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://github.com/apache/airflow/
  summary: Provider package apache-airflow-providers-apache-hdfs for Apache Airflow
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-apache-hdfs/stable/index.html
  repository: https://github.com/apache/airflow/

extra:
  recipe-maintainers:
    - xylar
